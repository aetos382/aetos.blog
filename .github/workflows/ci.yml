name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Kroki server used to render diagrams in AsciiDoc documents at build time.
      # Renovate updates these tags together with .devcontainer/docker-compose.yaml (the "Kroki" group in renovate.json).
      kroki:
        image: yuzutech/kroki:0.33.0@sha256:a4341ac44cd2590124da7142d13fdf5d83eadc2b94c023d018a2227695a30da1
        env:
          KROKI_MERMAID_HOST: mermaid
        ports:
          - 8000:8000
      mermaid:
        image: yuzutech/kroki-mermaid:0.33.0@sha256:2fd07c6ef9ef99e59c288f125fdb411188569237544f7db8d69935a2d7efa08d
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for Kroki
        run: timeout 60 bash -c 'until curl --fail --silent http://localhost:8000/health > /dev/null; do sleep 2; done'
      - run: npm run check
      - run: npm run build
      # Publish only what is built from main (pushes, or manual runs on main).
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  # A mismatch between the workflows and actions.lock, or a lockfile that cannot be read, does not
  # show in the workflows themselves, and the pre-commit hook can be bypassed, so it is stopped here.
  actions-lock:
    runs-on: ubuntu-latest
    # The token is handed to an extension fetched by tag, so it is kept read-only.
    permissions:
      contents: read
    env:
      # Used to fetch the extension and for the GitHub API calls that --verify makes.
      GH_TOKEN: ${{ github.token }}
    steps:
      # Images are not needed here, so LFS objects are not fetched.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify actions.lock
        run: |
          set -euo pipefail
          # Verify with the same version as the dev container.
          source .devcontainer/versions.sh
          # Renovate regenerates actions.lock with constraints.ghActionsLock, so that has to be the
          # same version. The shared Renovate preset updates both, but nothing else checks that they
          # agree.
          constraint="$(jq -r '.constraints.ghActionsLock' renovate.json)"
          if [ "${constraint}" != "${GH_ACTIONS_LOCK_VERSION}" ]; then
            echo "::error::constraints.ghActionsLock in renovate.json (${constraint}) differs from GH_ACTIONS_LOCK_VERSION in .devcontainer/versions.sh (${GH_ACTIONS_LOCK_VERSION})." >&2
            exit 1
          fi
          gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"
          # The exit code alone is not enough: when the GitHub API cannot be reached, the commits
          # are left unverified, which is reported only as a warning finding with exit code 0.
          # Info findings (such as the record of a deleted workflow) are allowed. Checked with v0.2.0.
          status=0
          result="$(gh actions-lock --no-fix --no-interactive --verify --json=valid,findings)" || status=$?
          printf '%s\n' "${result}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if ! jq -e '.valid == true and all(.findings[]; .severity == "info")' <<<"${result}" >/dev/null; then
            echo "::error::gh actions-lock reported findings, or could not verify the pinned commits." >&2
            exit 1
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploy one at a time, but don't cancel a deployment in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  # The only status check that the main branch ruleset requires. The results of all other jobs are
  # aggregated here, so that the ruleset needs no change whenever a job is added or renamed.
  # Add every new job to needs. A job that is missing there does not block a merge when it fails.
  # Do not rename this job: the ruleset refers to it by this ID.
  ci-passed:
    # When a job in needs fails, this job is skipped by default, and a skipped job satisfies a
    # required check. always() makes it run, so that it can fail here instead.
    if: always()
    needs:
      - build
      - actions-lock
      - deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          # deploy runs only for main, so it is skipped on pull requests. That is the one result
          # other than success that is accepted. When build fails, deploy is skipped as well, but
          # then build itself fails this check.
          if ! jq -e 'all(to_entries[]; .value.result == "success" or (.key == "deploy" and .value.result == "skipped"))' <<<"$NEEDS" >/dev/null; then
            echo "::error::Not all jobs succeeded." >&2
            exit 1
          fi
