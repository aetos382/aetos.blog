name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Kroki server used to render diagrams in AsciiDoc documents at build time.
      # Renovate updates these tags together with compose.yaml (the "Kroki" group in renovate.json).
      kroki:
        image: yuzutech/kroki:0.32.1
        env:
          KROKI_MERMAID_HOST: mermaid
        ports:
          - 8000:8000
      mermaid:
        image: yuzutech/kroki-mermaid:0.32.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for Kroki
        run: timeout 60 bash -c 'until curl --fail --silent http://localhost:8000/health > /dev/null; do sleep 2; done'
      - run: npm run check
      - run: npm run build
      # Publish only what is built from main (pushes, or manual runs on main).
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploy one at a time, but don't cancel a deployment in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
