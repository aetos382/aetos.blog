services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:3-ubuntu26.04@sha256:edfb983aab9c579a385dc23c57d7d3703f5ec920124d99c16204a2cac465aab4
    volumes:
      - ../..:/workspaces:cached
    environment:
      KROKI_SERVER_URL: http://kroki:8000
    depends_on:
      kroki:
        condition: service_healthy
  kroki:
    image: yuzutech/kroki:0.33.0@sha256:a4341ac44cd2590124da7142d13fdf5d83eadc2b94c023d018a2227695a30da1
    environment:
      KROKI_MERMAID_HOST: mermaid
    networks:
      - default
      - kroki-internal
    depends_on:
      mermaid:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
  mermaid:
    image: yuzutech/kroki-mermaid:0.33.0@sha256:2fd07c6ef9ef99e59c288f125fdb411188569237544f7db8d69935a2d7efa08d
    networks:
      - kroki-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

networks:
  kroki-internal:
    internal: true
