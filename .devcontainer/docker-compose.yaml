services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:3-ubuntu26.04@sha256:b1e3b08610ae0b2599f57c3a492eebc93d1d26dbaefb4a0bad0caa7149e4ec95
    volumes:
      - ../..:/workspaces:cached
    environment:
      KROKI_SERVER_URL: http://kroki:8000
  kroki:
    image: yuzutech/kroki:0.36.0@sha256:de0f2fdc42e926d54706ac962aa5cfb38c5c387035a1b30d07ce297bbc37057b
    environment:
      KROKI_MERMAID_HOST: mermaid
    networks:
      - default
      - kroki-internal
    depends_on:
      mermaid:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "--timeout=2", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
  mermaid:
    image: yuzutech/kroki-mermaid:0.36.0@sha256:0f9d9420d2577474f20909bb0679d398949561d5d88435e66e742b28db066bd2
    networks:
      - kroki-internal
    restart: unless-stopped
    # node を PID 1 にしない。PID 1 だと、下の healthcheck から SIGKILL で終了させられない。
    init: true
    healthcheck:
      # 負荷が高いときに起動すると、Chrome の起動がタイムアウトし、その後 /health が応答を返さないままになる。
      # 自力では復旧せず、プロセスも終了しないので、restart ポリシーも働かない。
      # 起動から 60 秒（start_period）を過ぎても応答しなければ、コンテナー内のプロセスをすべて終了させて、
      # restart ポリシーにコンテナーを再起動させる。SIGTERM では、この状態の node は終了しない。
      # wget のタイムアウトは、下の timeout より短くする。先に timeout になると、kill まで進まない。
      test:
        - CMD-SHELL
        - |
          wget --quiet --output-document=/dev/null --timeout=2 http://localhost:8002/health && exit 0
          [ "$$(( $$(date +%s) - $$(stat -c %Y /proc/1) ))" -gt 60 ] && kill -KILL -1
          exit 1
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

networks:
  kroki-internal:
    internal: true
